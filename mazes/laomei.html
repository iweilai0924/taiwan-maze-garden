<title>石門老梅迷宮</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a maze-map board in the middle, controls and record strip above it, legend and notes below. */
:root{
  --bg:#f3f5ee; --sub:#878b7e; --line2:#ccd2c0; --brand:#2f8033; --brand-soft:rgba(58,154,57,.09); --brand-grid:rgba(47,128,51,.055); --paper:#fbfcf7; --ink:#1c1e19; --muted:#62675b; --line:#e0e3d6;
  --lawn:#cfdfb8; --soil:#93745a; --walk:#e4ddcc; --plaza:#d6d0c5; --cap:#f1ebdf; --wall-edge:#5e4636;
  --trail:#d2502f; --player:#c2361b; --sol:#d2502f;
  --g-win:#efc22d; --g-pass:#e5873a; --g-start:#d23b3b; --g-edge:#3b3b3b;
  --btn:#ffffff; --btn-on:#2f8033; --btn-on-ink:#ffffff;
  --display:"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --body:"PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141814; --sub:#99a092; --line2:#3c443a; --brand:#7cc47f; --brand-soft:rgba(124,196,127,.07); --brand-grid:rgba(124,196,127,.05); --paper:#1b201b; --ink:#e7eae2; --muted:#aab1a3; --line:#2b312a;
  --lawn:#2e3a26; --soil:#6b5442; --walk:#9c9483; --plaza:#7f7a71; --cap:#efe7da; --wall-edge:#1c140f;
  --trail:#ff8a5c; --player:#ff7043; --sol:#ff8a5c;
  --g-win:#f2cc3a; --g-pass:#f0974d; --g-start:#ef5a5a; --g-edge:#111111;
  --btn:#1f251f; --btn-on:#7cc47f; --btn-on-ink:#10170f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141814; --sub:#99a092; --line2:#3c443a; --brand:#7cc47f; --brand-soft:rgba(124,196,127,.07); --brand-grid:rgba(124,196,127,.05); --paper:#1b201b; --ink:#e7eae2; --muted:#aab1a3; --line:#2b312a;
  --lawn:#2e3a26; --soil:#6b5442; --walk:#9c9483; --plaza:#7f7a71; --cap:#efe7da; --wall-edge:#1c140f;
  --trail:#ff8a5c; --player:#ff7043; --sol:#ff8a5c;
  --g-win:#f2cc3a; --g-pass:#f0974d; --g-start:#ef5a5a; --g-edge:#111111;
  --btn:#1f251f; --btn-on:#7cc47f; --btn-on-ink:#10170f; color-scheme:dark }
html{font-size:17px}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.65;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 44px}
/* 數感方格紙：細格線＋兩團綠色的光（嵌在合輯頁裡時改用外框的背景） */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1000px 700px at 88% -8%,var(--brand-soft),transparent 62%),
    radial-gradient(1200px 800px at -12% 108%,var(--brand-soft),transparent 58%),
    repeating-linear-gradient(0deg,var(--brand-grid) 0 1px,transparent 1px 28px),
    repeating-linear-gradient(90deg,var(--brand-grid) 0 1px,transparent 1px 28px)}
html.embedded,html.embedded body{background:transparent}
html.embedded body{padding-top:4px}
html.embedded body::before{display:none}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;display:grid;gap:14px;min-width:0}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;border-bottom:2.5px solid var(--brand);padding-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.55rem,3vw,2.1rem);letter-spacing:.1em;line-height:1.25;margin:0}
.lede{margin:0;color:var(--muted);font-size:.97rem;max-width:78ch;flex:1 1 32ch}
html.embedded header{border-bottom:0;padding-bottom:0}
html.embedded header h1{display:none}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--btn)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 .95rem/1.2 var(--body);letter-spacing:.05em;padding:10px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line2);background:var(--btn);color:var(--ink);font:600 .95rem/1.2 var(--body);letter-spacing:.05em;padding:10px 18px;border-radius:999px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--btn-on);border-color:var(--btn-on);color:var(--btn-on-ink)}
.btn:not([aria-pressed="true"]):hover,.seg button:not([aria-pressed="true"]):hover{background:color-mix(in srgb,var(--brand) 10%,var(--btn))}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;gap:6px 28px;font-variant-numeric:tabular-nums}
.hud div{display:grid;line-height:1.2}
.hud span{font-size:.78rem;color:var(--sub);letter-spacing:.08em}
.hud b{font-family:var(--body);font-size:1.5rem;font-weight:700}
.board{position:relative;background:var(--paper);border:1.5px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px -20px rgba(28,60,28,.45)}
canvas{display:block;width:100%;touch-action:none}
#cv{cursor:crosshair}
#mini{position:absolute;right:12px;top:12px;width:min(30%,280px);border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);pointer-events:none}
.hint{position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;display:flex;justify-content:center}
.hint p{margin:0;background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;font-size:.88rem;color:var(--ink);text-align:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:.08em;color:var(--ink);background:var(--paper)}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);padding:16px}
.card{background:var(--paper);border:1.5px solid var(--line2);border-top:4px solid var(--brand);border-radius:16px;padding:22px 24px;max-width:400px;display:grid;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.18)}
.card h2{margin:0;font-family:var(--display);font-size:1.6rem;letter-spacing:.06em}
.card p{margin:0;color:var(--muted)}
.card .btns{justify-content:flex-end}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.92rem}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:20px;height:20px;flex:none}
.notes{font-size:.82rem;color:var(--sub);max-width:84ch;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.notes p{margin:0}
@media (max-width:560px){ html{font-size:16px} .seg button,.btn{padding:9px 13px;font-size:.9rem} .hud{gap:4px 18px} .hud b{font-size:1.3rem} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
[hidden]{display:none!important}

<script>try{if(window.frameElement)document.documentElement.classList.add("embedded")}catch(e){}</script>

<div class="wrap">
  <header>
    <h1>石門老梅迷宮</h1>
    <p class="lede">從外環步道的紅色起點出發，在紅磚牆之間找路，走到正中央的圓形小房間。牆的上半段有鏤空花紋，「走進迷宮」時可以從花磚縫偷看隔壁的走道。</p>
  </header>

  <div class="bar">
    <div class="hud" aria-live="polite">
      <div><span>時間</span><b id="t">0:00</b></div>
      <div><span>走了</span><b id="d">0 公尺</b></div>
      <div><span>最佳紀錄</span><b id="best">—</b></div>
    </div>
    <div class="btns">
      <div class="seg" role="group" aria-label="視角">
        <button id="v-all" aria-pressed="true">俯瞰全景</button>
        <button id="v-near" aria-pressed="false">俯瞰近看</button>
        <button id="v-3d" aria-pressed="false">走進迷宮</button>
      </div>
      <button class="btn" id="minibtn" aria-pressed="false" hidden>小地圖</button>
      <button class="btn" id="restart">重新開始</button>
      <button class="btn" id="answer" aria-pressed="false">看解答</button>
    </div>
  </div>

  <div class="board" id="board">
    <canvas id="cv" aria-label="石門老梅迷宮俯瞰地圖，用方向鍵或拖曳移動"></canvas>
    <canvas id="gl" aria-label="走在老梅迷宮紅磚牆之間的立體視角，上下鍵前進後退、左右鍵轉向" hidden></canvas>
    <canvas id="mini" hidden></canvas>
    <div class="loading" id="loading" hidden>正在砌磚牆⋯⋯</div>
    <div class="hint" id="hint"><p id="hint-text">用方向鍵（或 WASD）走，手機在地圖上按住往想去的方向拖。</p></div>
    <div class="modal" id="m-win" hidden>
      <div class="card">
        <h2>走到中心了！</h2>
        <p id="win-text"></p>
        <div class="btns"><button class="btn" id="w-again">再走一次</button></div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><svg viewBox="0 0 20 20"><polygon points="2,4 18,4 10,18" fill="var(--g-start)"/></svg>起點</span>
    <span><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="var(--g-win)" stroke="var(--g-edge)" stroke-width="1.5"/></svg>中心（終點）</span>
    <span><svg viewBox="0 0 20 20"><rect x="1" y="7" width="18" height="6" rx="3" fill="var(--cap)" stroke="var(--wall-edge)" stroke-width="1.5"/></svg>紅磚牆（俯瞰看到的是牆頂）</span>
    <span><svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="3" fill="var(--soil)"/></svg>迷宮走道（泥土地）</span>
    <span><svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="3" fill="var(--walk)" stroke="var(--line)"/></svg>外環步道</span>
    <span><svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="3" fill="var(--plaza)" stroke="var(--line)"/></svg>廣場</span>
  </div>

  <div class="notes">
    <p>牆位置依 2021 年空拍影片判讀重繪，長短粗細為約略值。</p>
    <p>走了幾公尺是依比例換算的估計值（整座迷宮直徑約 21 公尺）。「走進迷宮」的牆高、視線高度與鏤空花紋是為了遊戲手感設定的示意。</p>
  </div>
</div>

        quad(1, [[R1[0],WALL_H+CAP_H,R1[1]],[R2[0],WALL_H+CAP_H,R2[1]],[L2[0],WALL_H+CAP_H,L2[1]],[L1[0],WALL_H+CAP_H,L1[1]]], [up,up,up,up], [[u,0],[u2,0],[u2,.4],[u,.4]], [capHi,capHi,capHi,capHi]);
        // posts at sharp corners and every ~2.6 m along long runs
        run += len;
        if (k < n-2){
          const a = sn[k], b = sn[k+1], turn = Math.acos(Math.max(-1, Math.min(1, a[0]*b[0] + a[1]*b[1])));
          if (turn > 0.6 || run > 120){ addPost(pts[k+1][0], pts[k+1][1], Math.atan2(a[1]+b[1], a[0]+b[0])); run = 0; }
        }
        u = u2;
      }
    }
    const geo = new THREE.BufferGeometry(), all = {pos:[], nor:[], uv:[], col:[], idx:[]};
    groups.forEach((G, g) => {
      const base = all.pos.length/3, start = all.idx.length;
      all.pos = all.pos.concat(G.pos); all.nor = all.nor.concat(G.nor); all.uv = all.uv.concat(G.uv); all.col = all.col.concat(G.col);
      for (let i=0;i<G.idx.length;i++) all.idx.push(G.idx[i] + base);
      geo.addGroup(start, G.idx.length, g);
    });
    geo.setAttribute('position', new THREE.Float32BufferAttribute(all.pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(all.nor, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(all.uv, 2));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(all.col, 3));
    geo.setIndex(all.idx);
    const ct = concreteTexture();
    const brickMat = new THREE.MeshLambertMaterial({map: brickTexture(), vertexColors: true, side: THREE.DoubleSide, alphaTest: 0.5});
    const capMat = new THREE.MeshLambertMaterial({map: ct, vertexColors: true, side: THREE.DoubleSide});
    scene.add(new THREE.Mesh(geo, [brickMat, capMat]));

    // square concrete posts (one instanced draw call)
    const postGeo = new THREE.BoxGeometry(POST_W, POST_H, POST_W); postGeo.translate(0, POST_H/2, 0);
    const postMesh = new THREE.InstancedMesh(postGeo, new THREE.MeshLambertMaterial({map: ct, color: 0xd9d3c8}), posts.length);
    { const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1,1,1), up = new THREE.Vector3(0,1,0);
      posts.forEach(([x,z,a], i) => { q.setFromAxisAngle(up, -a); m4.compose(new THREE.Vector3(x, 0, z), q, one); postMesh.setMatrixAt(i, m4); }); }
    scene.add(postMesh);

    // goal sign floating above the central room
    const sp = labelSprite('中心'); sp.position.set(GOAL[0], WALL_H + 34, GOAL[1]); scene.add(sp);

    // trees and grass mounds outside the walkway ring
    const rnd = mkRnd(5);
    const trunkG = new THREE.CylinderGeometry(5, 7, 120, 7), crownG = new THREE.IcosahedronGeometry(70, 1), tuftG = new THREE.IcosahedronGeometry(16, 0);
    const N = 46, trunks = new THREE.InstancedMesh(trunkG, new THREE.MeshLambertMaterial({color: 0x6b4e33}), N), crowns = new THREE.InstancedMesh(crownG, new THREE.MeshLambertMaterial({color: 0x3f7a39}), N);
    const NT = 160, tufts = new THREE.InstancedMesh(tuftG, new THREE.MeshLambertMaterial({color: 0x5f8f3e}), NT);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
    for (let i=0;i<N;i++){
      const a = rnd()*Math.PI*2, p = ePt(a, 1.45 + rnd()*0.9), s = 0.8 + rnd()*0.7;
      sc.set(s,s,s); m4.compose(new THREE.Vector3(p[0], 60*s, p[1]), q, sc); trunks.setMatrixAt(i, m4);
      sc.set(s, s*(0.8+rnd()*0.5), s); m4.compose(new THREE.Vector3(p[0], 165*s, p[1]), q, sc); crowns.setMatrixAt(i, m4);
    }
    for (let i=0;i<NT;i++){
      const a = rnd()*Math.PI*2, p = ePt(a, 1.16 + rnd()*0.5), s = 0.6 + rnd()*1.2;
      sc.set(s*1.4, s*0.55, s*1.4); m4.compose(new THREE.Vector3(p[0], 2, p[1]), q, sc); tufts.setMatrixAt(i, m4);
    }
    scene.add(trunks, crowns, tufts);

    // solution: a faint red ribbon on the ground
    const sp2 = [], si = [];
    for (let k=0;k<SOL.length;k++){
      const a = SOL[Math.max(0,k-1)], b = SOL[Math.min(SOL.length-1,k+1)], dx = b[0]-a[0], dz = b[1]-a[1], L = Math.hypot(dx,dz) || 1, nx = -dz/L*2.5, nz = dx/L*2.5;
      sp2.push(SOL[k][0]+nx, 0.7, SOL[k][1]+nz, SOL[k][0]-nx, 0.7, SOL[k][1]-nz);
      if (k) { const b0 = (k-1)*2; si.push(b0, b0+1, b0+2, b0+1, b0+3, b0+2); }
    }
    const solGeo = new THREE.BufferGeometry(); solGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp2, 3)); solGeo.setIndex(si);
    const sol = new THREE.Mesh(solGeo, new THREE.MeshBasicMaterial({color: 0xd2502f, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide}));
    sol.visible = showAns; scene.add(sol);

    // trail on the ground
    const trailGeo = new THREE.BufferGeometry(); trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(3*20000), 3));
    const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({color: 0xff5a36})); trail.frustumCulled = false; scene.add(trail);

    three = {renderer, scene, camera, sol, trail, trailGeo};
  }
  function draw3D(){
    if (!three) return;
    const {renderer, scene, camera, trailGeo} = three;
    camera.position.set(st.x, EYE, st.y);
    camera.lookAt(st.x + Math.cos(st.h)*40, EYE - 5, st.y + Math.sin(st.h)*40);
    const n = Math.min(st.trail.length, 20000), arr = trailGeo.attributes.position.array;
    for (let i=0;i<n;i++){ arr[i*3] = st.trail[i][0]; arr[i*3+1] = 0.5; arr[i*3+2] = st.trail[i][1]; }
    trailGeo.setDrawRange(0, n); trailGeo.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
    if (showMini){
      const W = mini.width/dpr, H = mini.height/dpr, s = W/WW;
      drawMap(mctx, W, H, {s, ox:-minX*s, oy:-minY*s}, {dpr, mini:true});
    }
  }
  // joystick overlay for 3D drawn on a 2D layer above the GL canvas
  const joy = document.createElement('canvas'); joy.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;width:100%'; $('board').appendChild(joy); const jctx = joy.getContext('2d');

  // ---------- loop ----------
  let lastT = null;
  function frame(ts){
    const dt = lastT == null ? 0 : Math.min(0.05, (ts - lastT)/1000); lastT = ts;
    if (!st.done){
      if (update(dt)){ if (st.t0 == null){ st.t0 = 0; $('hint').hidden = true; } checkGoal(); }
      if (st.t0 != null) st.t += dt;
      hud();
    }
    if (view === '3d'){
      draw3D();
      joy.hidden = false; joy.width = Math.round(cw*dpr); joy.height = Math.round(chh*dpr); joy.style.height = chh + 'px';
      jctx.setTransform(dpr,0,0,dpr,0,0); jctx.clearRect(0,0,cw,chh); drawJoy(jctx);
    } else { joy.hidden = true; draw2D(); }
    requestAnimationFrame(frame);
  }
  reset();
  setView(matchMedia('(max-width: 700px)').matches ? 'near' : 'all');
  requestAnimationFrame(frame);
})();
</script>

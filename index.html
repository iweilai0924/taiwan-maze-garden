<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣迷宮花園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5ee;--paper:#fbfcf7;--ink:#1c1e19;--muted:#62675b;--sub:#878b7e;--line:#e0e3d6;--line2:#ccd2c0;
 --brand:#2f8033;--brand-ink:#ffffff;--brand-soft:rgba(58,154,57,.09);--brand-grid:rgba(47,128,51,.055);
 --font:"PingFang TC","Noto Sans TC",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141814;--paper:#1b201b;--ink:#e7eae2;--muted:#aab1a3;--sub:#99a092;--line:#2b312a;--line2:#3c443a;
 --brand:#7cc47f;--brand-ink:#10170f;--brand-soft:rgba(124,196,127,.07);--brand-grid:rgba(124,196,127,.05);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141814;--paper:#1b201b;--ink:#e7eae2;--muted:#aab1a3;--sub:#99a092;--line:#2b312a;--line2:#3c443a;
 --brand:#7cc47f;--brand-ink:#10170f;--brand-soft:rgba(124,196,127,.07);--brand-grid:rgba(124,196,127,.05);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{font-size:18.5px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{line-height:1.7;overflow-x:hidden}
/* 數學方格紙：細格線＋兩團綠色的光 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1000px 700px at 88% -8%,var(--brand-soft),transparent 62%),
    radial-gradient(1200px 800px at -12% 108%,var(--brand-soft),transparent 58%),
    repeating-linear-gradient(0deg,var(--brand-grid) 0 1px,transparent 1px 28px),
    repeating-linear-gradient(90deg,var(--brand-grid) 0 1px,transparent 1px 28px)}
.top,.stage{position:relative;z-index:2}
.top{max-width:1432px;margin:0 auto;padding:28px 16px 4px}
header{position:relative;display:flex;align-items:flex-end;gap:16px;border-bottom:2.5px solid var(--brand);padding-bottom:12px;min-height:118px}
.ttl{flex:1;min-width:0}
h1{font-weight:700;font-size:1.8rem;letter-spacing:.1em;line-height:1.3;margin:0}
.sub{color:var(--sub);font-size:.82rem;letter-spacing:.03em;margin:4px 0 0}
.cast{display:flex;align-items:flex-end;gap:2px;flex:none;margin-bottom:-12px}
.cast img{display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.c-lin{height:124px} .c-dot{height:116px} .c-num{height:58px;margin-bottom:10px} .c-numi{height:48px;margin-bottom:6px} .c-pimi{height:56px;margin-bottom:4px}
.picker{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 6px}
.card{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line2);border-radius:999px;padding:8px 18px 8px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:border-color .15s,background .15s,transform .15s}
.card:hover{transform:translateY(-1px);border-color:var(--brand)}
.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.card[aria-selected="true"] .tag{background:rgba(255,255,255,.22);color:var(--brand-ink)}
.name{font-size:.95rem;font-weight:700;letter-spacing:.06em}
.desc{color:var(--muted);font-size:.85rem;margin:6px 2px 0}
.stage{width:100%}
iframe{display:block;width:100%;border:0;min-height:80vh;background:transparent}
/* IP 角色：兩側空白夠寬時才在邊上漂著，不蓋到迷宮 */
#ipworld{position:fixed;inset:0;pointer-events:none;z-index:1;display:none}
.ip{position:fixed} .ip img{display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.ip-num{left:max(10px,calc(50vw - 700px - 120px));top:34vh} .ip-num img{height:92px}
.ip-numi{left:max(16px,calc(50vw - 700px - 100px));top:70vh} .ip-numi img{height:70px}
.ip-pimi{right:max(14px,calc(50vw - 700px - 104px));top:46vh} .ip-pimi img{height:84px}
@media (min-width:1660px){#ipworld{display:block}}
.bob{animation:bob 4.2s ease-in-out infinite alternate}
.bob2{animation:bob 5.1s .7s ease-in-out infinite alternate}
.bob3{animation:bob 3.6s 1.3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-6px) rotate(-3deg)}to{transform:translateY(6px) rotate(3deg)}}
@media (max-width:760px){html{font-size:17px} header{min-height:86px} .cast .c-lin{height:80px} .cast .c-dot{height:74px} .cast .c-num,.cast .c-numi,.cast .c-pimi{display:none} h1{font-size:1.5rem;white-space:nowrap}}
@media (max-width:420px){.cast .c-lin{display:none} .card{padding:6px 14px 6px 6px} .name{font-size:.88rem}}
@media (prefers-reduced-motion: reduce){.bob,.bob2,.bob3{animation:none}}
</style>
</head>

.seg button[aria-pressed=&quot;true&quot;]{background:var(--btn-on);color:var(--btn-on-ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line2);background:var(--btn);color:var(--ink);font:600 .95rem/1.2 var(--body);letter-spacing:.05em;padding:10px 18px;border-radius:999px;cursor:pointer}
.btn[aria-pressed=&quot;true&quot;]{background:var(--btn-on);border-color:var(--btn-on);color:var(--btn-on-ink)}
.btn:not([aria-pressed=&quot;true&quot;]):hover,.seg button:not([aria-pressed=&quot;true&quot;]):hover{background:color-mix(in srgb,var(--brand) 10%,var(--btn))}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;gap:6px 28px;font-variant-numeric:tabular-nums}
.hud div{display:grid;line-height:1.2}
.hud span{font-size:.78rem;color:var(--sub);letter-spacing:.08em}
.hud b{font-family:var(--body);font-size:1.5rem;font-weight:700}
.board{position:relative;background:var(--paper);border:1.5px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px -20px rgba(28,60,28,.45)}
canvas{display:block;width:100%;touch-action:none}
#cv{cursor:crosshair}
#mini{position:absolute;right:12px;top:12px;width:min(30%,280px);border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);pointer-events:none}
.hint{position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;display:flex;justify-content:center}
.hint p{margin:0;background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;font-size:.88rem;color:var(--ink);text-align:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:.08em;color:var(--ink);background:var(--paper)}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);padding:16px}
.card{background:var(--paper);border:1.5px solid var(--line2);border-top:4px solid var(--brand);border-radius:16px;padding:22px 24px;max-width:400px;display:grid;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.18)}
.card h2{margin:0;font-family:var(--display);font-size:1.6rem;letter-spacing:.06em}
.card p{margin:0;color:var(--muted)}
.card .btns{justify-content:flex-end}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.92rem}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:20px;height:20px;flex:none}
.notes{font-size:.82rem;color:var(--sub);max-width:84ch;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.notes p{margin:0}
@media (max-width:560px){ html{font-size:16px} .seg button,.btn{padding:9px 13px;font-size:.9rem} .hud{gap:4px 18px} .hud b{font-size:1.3rem} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
[hidden]{display:none!important}

&lt;script&gt;try{if(window.frameElement)document.documentElement.classList.add(&quot;embedded&quot;)}catch(e){}&lt;/script&gt;

&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;新生公園迷宮花園&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;從紅色倒三角形的挑戰門出發，穿過兩組橘色過關門，走到黃色的勝利門。累了可以從白色的投降門離開。&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;bar&quot;&gt;
    &lt;div class=&quot;hud&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div&gt;&lt;span&gt;時間&lt;/span&gt;&lt;b id=&quot;t&quot;&gt;0:00&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;走了&lt;/span&gt;&lt;b id=&quot;d&quot;&gt;0 公尺&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;過關門&lt;/span&gt;&lt;b id=&quot;p&quot;&gt;0 / 2 組&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;最佳紀錄&lt;/span&gt;&lt;b id=&quot;best&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;
      &lt;div class=&quot;seg&quot; role=&quot;group&quot; aria-label=&quot;視角&quot;&gt;
        &lt;button id=&quot;v-all&quot; aria-pressed=&quot;true&quot;&gt;俯瞰全景&lt;/button&gt;
        &lt;button id=&quot;v-near&quot; aria-pressed=&quot;false&quot;&gt;俯瞰近看&lt;/button&gt;
        &lt;button id=&quot;v-3d&quot; aria-pressed=&quot;false&quot;&gt;走進迷宮&lt;/button&gt;
      &lt;/div&gt;
      &lt;button class=&quot;btn&quot; id=&quot;minibtn&quot; aria-pressed=&quot;false&quot; hidden&gt;小地圖&lt;/button&gt;
      &lt;button class=&quot;btn&quot; id=&quot;restart&quot;&gt;重新開始&lt;/button&gt;
      &lt;button class=&quot;btn&quot; id=&quot;answer&quot; aria-pressed=&quot;false&quot;&gt;看解答&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;canvas id=&quot;cv&quot; aria-label=&quot;新生公園迷宮俯瞰地圖，用方向鍵或拖曳移動&quot;&gt;&lt;/canvas&gt;
    &lt;canvas id=&quot;gl&quot; aria-label=&quot;走在新生公園迷宮裡的立體視角，上下鍵前進後退、左右鍵轉向&quot; hidden&gt;&lt;/canvas&gt;
    &lt;canvas id=&quot;mini&quot; hidden&gt;&lt;/canvas&gt;
    &lt;div class=&quot;loading&quot; id=&quot;loading&quot; hidden&gt;正在種樹籬⋯⋯&lt;/div&gt;
    &lt;div class=&quot;hint&quot; id=&quot;hint&quot;&gt;&lt;p id=&quot;hint-text&quot;&gt;用方向鍵（或 WASD）走，手機在地圖上按住往想去的方向拖。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;modal&quot; id=&quot;m-quit&quot; hidden&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h2&gt;這是投降門&lt;/h2&gt;
        &lt;p&gt;從這裡出去就到外面的草地了。要放棄這一輪嗎？&lt;/p&gt;
        &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;q-stay&quot;&gt;繼續走&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;q-leave&quot;&gt;出去，重來&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;modal&quot; id=&quot;m-win&quot; hidden&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h2&gt;走到勝利門了！&lt;/h2&gt;
        &lt;p id=&quot;win-text&quot;&gt;&lt;/p&gt;
        &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;w-again&quot;&gt;再走一次&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;polygon points=&quot;2,4 18,4 10,18&quot; fill=&quot;var(--g-start)&quot;/&gt;&lt;/svg&gt;挑戰門（起點）&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;polygon points=&quot;10,2 18,10 10,18 2,10&quot; fill=&quot;var(--g-pass)&quot;/&gt;&lt;/svg&gt;過關門（兩個一組，跨過草地）&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;7.5&quot; fill=&quot;var(--g-win)&quot; stroke=&quot;var(--g-edge)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;勝利門（終點）&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;7.5&quot; fill=&quot;var(--g-quit)&quot; stroke=&quot;var(--g-edge)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;投降門&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;rect x=&quot;1&quot; y=&quot;7&quot; width=&quot;18&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;var(--gravel)&quot; stroke=&quot;var(--hedge-edge)&quot; stroke-width=&quot;1&quot;/&gt;&lt;/svg&gt;走道&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;rect x=&quot;2&quot; y=&quot;2&quot; width=&quot;16&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--hedge)&quot;/&gt;&lt;/svg&gt;樹籬&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;notes&quot;&gt;
    &lt;p&gt;路線依臺北市公園路燈工程管理處「迷宮花園基本路徑圖」（迷宮入口告示牌）逐線重繪。現場樹籬可能因修剪、補植而跟告示牌不同，實際走法以現場為準。&lt;/p&gt;
    &lt;p&gt;走了幾公尺是依國土測繪中心航照的比例換算的估計值（整座八角形迷宮東西寬約 70 公尺）。「走進迷宮」的樹籬高度與走道寬度是為了遊戲手感設定的示意。&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

.hint p{margin:0;background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;font-size:.88rem;color:var(--ink);text-align:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:.08em;color:var(--ink);background:var(--paper)}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);padding:16px}
.card{background:var(--paper);border:1.5px solid var(--line2);border-top:4px solid var(--brand);border-radius:16px;padding:22px 24px;max-width:400px;display:grid;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.18)}
.card h2{margin:0;font-family:var(--display);font-size:1.6rem;letter-spacing:.06em}
.card p{margin:0;color:var(--muted)}
.card .btns{justify-content:flex-end}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.92rem}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:20px;height:20px;flex:none}
.notes{font-size:.82rem;color:var(--sub);max-width:84ch;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.notes p{margin:0}
@media (max-width:560px){ html{font-size:16px} .seg button,.btn{padding:9px 13px;font-size:.9rem} .hud{gap:4px 18px} .hud b{font-size:1.3rem} }
.legend .cast img{height:30px;width:auto;max-width:32px;object-fit:contain}
.legend .castnote{color:var(--sub)}
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 10px));pointer-events:none;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;padding:7px 14px;font-size:1rem;line-height:1.4;width:max-content;max-width:min(86%,360px);box-shadow:0 4px 12px rgba(0,0,0,.18);display:grid;gap:1px;text-align:center}
.bubble b{font-size:.8rem;color:var(--brand);font-weight:700;letter-spacing:.06em}
.bubble b:empty{display:none}
.bubble::after{content:&quot;&quot;;position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--paper);border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
[hidden]{display:none!important}

&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;石門老梅迷宮・數感版&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;從外環步道的紅色起點出發，在長出樹幹、青苔和小蘑菇的紅磚牆之間找路，走到正中央的圓形小房間。小點、凜和三個外星夥伴 Numnum、Numi、Looppi 嚕嗶也在迷宮裡散步，走近一點，聽聽他們說什麼。牆的上半段一樣有鏤空花紋，「走進迷宮」時可以從縫裡偷看隔壁的走道。&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;bar&quot;&gt;
    &lt;div class=&quot;hud&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div&gt;&lt;span&gt;時間&lt;/span&gt;&lt;b id=&quot;t&quot;&gt;0:00&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;走了&lt;/span&gt;&lt;b id=&quot;d&quot;&gt;0 公尺&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;最佳紀錄&lt;/span&gt;&lt;b id=&quot;best&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;
      &lt;div class=&quot;seg&quot; role=&quot;group&quot; aria-label=&quot;視角&quot;&gt;
        &lt;button id=&quot;v-all&quot; aria-pressed=&quot;true&quot;&gt;俯瞰全景&lt;/button&gt;
        &lt;button id=&quot;v-near&quot; aria-pressed=&quot;false&quot;&gt;俯瞰近看&lt;/button&gt;
        &lt;button id=&quot;v-3d&quot; aria-pressed=&quot;false&quot;&gt;走進迷宮&lt;/button&gt;
      &lt;/div&gt;
      &lt;button class=&quot;btn&quot; id=&quot;minibtn&quot; aria-pressed=&quot;false&quot; hidden&gt;小地圖&lt;/button&gt;
      &lt;button class=&quot;btn&quot; id=&quot;restart&quot;&gt;重新開始&lt;/button&gt;
      &lt;button class=&quot;btn&quot; id=&quot;answer&quot; aria-pressed=&quot;false&quot;&gt;看解答&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;canvas id=&quot;cv&quot; aria-label=&quot;石門老梅迷宮俯瞰地圖，用方向鍵或拖曳移動&quot;&gt;&lt;/canvas&gt;
    &lt;canvas id=&quot;gl&quot; aria-label=&quot;走在長滿樹幹的老梅迷宮紅磚牆之間的立體視角，上下鍵前進後退、左右鍵轉向&quot; hidden&gt;&lt;/canvas&gt;
    &lt;canvas id=&quot;mini&quot; hidden&gt;&lt;/canvas&gt;
    &lt;div class=&quot;loading&quot; id=&quot;loading&quot; hidden&gt;正在種樹幹⋯⋯&lt;/div&gt;
    &lt;div class=&quot;bubble&quot; id=&quot;bubble&quot; hidden&gt;&lt;b id=&quot;bubble-name&quot;&gt;&lt;/b&gt;&lt;span id=&quot;bubble-text&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;hint&quot; id=&quot;hint&quot;&gt;&lt;p id=&quot;hint-text&quot;&gt;用方向鍵（或 WASD）走，手機在地圖上按住往想去的方向拖。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;modal&quot; id=&quot;m-win&quot; hidden&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h2&gt;走到中心了！&lt;/h2&gt;
        &lt;p id=&quot;win-text&quot;&gt;&lt;/p&gt;
        &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;w-again&quot;&gt;再走一次&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;polygon points=&quot;2,4 18,4 10,18&quot; fill=&quot;var(--g-start)&quot;/&gt;&lt;/svg&gt;起點&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;7.5&quot; fill=&quot;var(--g-win)&quot; stroke=&quot;var(--g-edge)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;中心（終點）&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;rect x=&quot;1&quot; y=&quot;7&quot; width=&quot;18&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;var(--cap)&quot; stroke=&quot;var(--wall-edge)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;紅磚牆（俯瞰看到的是牆頂）&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;7.5&quot; fill=&quot;var(--bark)&quot; stroke=&quot;var(--wall-edge)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;4.6&quot; fill=&quot;none&quot; stroke=&quot;var(--ring)&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;2&quot; fill=&quot;none&quot; stroke=&quot;var(--ring)&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;/svg&gt;樹幹柱&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;rect x=&quot;2&quot; y=&quot;2&quot; width=&quot;16&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--soil)&quot;/&gt;&lt;/svg&gt;迷宮走道（泥土地）&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;rect x=&quot;2&quot; y=&quot;2&quot; width=&quot;16&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--walk)&quot; stroke=&quot;var(--line)&quot;/&gt;&lt;/svg&gt;外環步道&lt;/span&gt;
    &lt;span&gt;&lt;svg viewBox=&quot;0 0 20 20&quot;&gt;&lt;rect x=&quot;2&quot; y=&quot;2&quot; width=&quot;16&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--plaza)&quot; stroke=&quot;var(--line)&quot;/&gt;&lt;/svg&gt;廣場&lt;/span&gt;
    &lt;span class=&quot;cast&quot;&gt;&lt;img id=&quot;lg-xiaodian&quot; alt=&quot;&quot;&gt;小點&lt;/span&gt;&lt;span class=&quot;cast&quot;&gt;&lt;img id=&quot;lg-lin&quot; alt=&quot;&quot;&gt;凜&lt;/span&gt;&lt;span class=&quot;cast&quot;&gt;&lt;img id=&quot;lg-numnum&quot; alt=&quot;&quot;&gt;Numnum&lt;/span&gt;&lt;span class=&quot;cast&quot;&gt;&lt;img id=&quot;lg-numi&quot; alt=&quot;&quot;&gt;Numi&lt;/span&gt;&lt;span class=&quot;cast&quot;&gt;&lt;img id=&quot;lg-looppi&quot; alt=&quot;&quot;&gt;Looppi 嚕嗶&lt;/span&gt;&lt;span class=&quot;castnote&quot;&gt;在迷宮裡散步的角色，不會擋路&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;notes&quot;&gt;
    &lt;p&gt;牆位置依 2021 年空拍影片判讀重繪，長短粗細為約略值。&lt;/p&gt;
    &lt;p&gt;走了幾公尺是依比例換算的估計值（整座迷宮直徑約 21 公尺）。「走進迷宮」的牆高、視線高度與鏤空花紋是為了遊戲手感設定的示意。&lt;/p&gt;
    &lt;p&gt;樹幹、木頭圓片、青苔、藤蔓和蘑菇是這個版本加上的裝飾，真實的老梅迷宮是紅磚牆；牆的位置、走道和解答都和原版相同。&lt;/p&gt;
    &lt;p&gt;角色為數感實驗室 IP（內部設定，未公開）。&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

    } else placeBubble();
    if (showMini){
      const W = mini.width/dpr, H = mini.height/dpr, s = W/WW;
      drawMap(mctx, W, H, {s, ox:-minX*s, oy:-minY*s}, {dpr, mini:true});
    }
  }
  // joystick overlay for 3D drawn on a 2D layer above the GL canvas
  const joy = document.createElement(&#x27;canvas&#x27;); joy.style.cssText = &#x27;position:absolute;left:0;top:0;pointer-events:none;width:100%&#x27;; $(&#x27;board&#x27;).appendChild(joy); const jctx = joy.getContext(&#x27;2d&#x27;);

  // ---------- loop ----------
  let lastT = null;
  function frame(ts){
    const dt = lastT == null ? 0 : Math.min(0.05, (ts - lastT)/1000); lastT = ts;
    updateNPCs(dt);
    if (!st.done){
      if (update(dt)){ if (st.t0 == null){ st.t0 = 0; $(&#x27;hint&#x27;).hidden = true; } checkGoal(); }
      if (st.t0 != null) st.t += dt;
      hud();
    }
    if (view === &#x27;3d&#x27;){
      draw3D();
      joy.hidden = false; joy.width = Math.round(cw*dpr); joy.height = Math.round(chh*dpr); joy.style.height = chh + &#x27;px&#x27;;
      jctx.setTransform(dpr,0,0,dpr,0,0); jctx.clearRect(0,0,cw,chh); drawJoy(jctx);
    } else { joy.hidden = true; draw2D(); }
    requestAnimationFrame(frame);
  }
  reset();
  setView(matchMedia(&#x27;(max-width: 700px)&#x27;).matches ? &#x27;near&#x27; : &#x27;all&#x27;);
  requestAnimationFrame(frame);
})();
&lt;/script&gt;

<script>
const cards=[...document.querySelectorAll('.card')], frames=[...document.querySelectorAll('iframe')];
function fit(f){try{const d=f.contentDocument; if(d&&d.documentElement) f.style.height=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px';}catch(e){}}
frames.forEach(f=>f.addEventListener('load',()=>{fit(f);try{new ResizeObserver(()=>fit(f)).observe(f.contentDocument.body)}catch(e){}}));
function pick(id,focus){
  cards.forEach(c=>{c.setAttribute('aria-selected',c.dataset.id===id); if(c.dataset.id===id) document.getElementById('desc').textContent=c.dataset.desc;});
  frames.forEach(f=>{f.hidden=f.dataset.id!==id; if(!f.hidden){fit(f); try{f.contentWindow.dispatchEvent(new Event('resize'))}catch(e){} if(focus) try{f.contentWindow.focus()}catch(e){}}});
  try{localStorage.setItem('maze-pick',id)}catch(e){}
  try{if(location.hash!=='#'+id) history.replaceState(null,'','#'+id)}catch(e){}
}
cards.forEach(c=>c.addEventListener('click',()=>pick(c.dataset.id,true)));
let first='xinsheng'; try{first=localStorage.getItem('maze-pick')||first}catch(e){}
const h=location.hash.slice(1); if(cards.some(c=>c.dataset.id===h)) first=h;
if(!cards.some(c=>c.dataset.id===first)) first='xinsheng';
pick(first,false);
</script>
